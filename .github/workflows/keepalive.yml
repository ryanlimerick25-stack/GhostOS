name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/ping
        run: |
          code=$(curl -s -o /tmp/body.json -w "%{http_code}" --max-time 30 https://ghostos.live/api/ping)
          echo "status=$code"; cat /tmp/body.json; echo
          test "$code" = "200"
