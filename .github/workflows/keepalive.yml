name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/ping
        run: |
          # Use the canonical www host: the apex 307-redirects, and a redirect is
          # served at the edge without invoking the function - so it would never
          # touch the database, which is the entire point of this job.
          # -L is belt-and-braces in case the canonical host changes again.
          code=$(curl -sL -o /tmp/body.json -w "%{http_code}" --max-time 30 https://www.ghostos.live/api/ping)
          echo "status=$code"; cat /tmp/body.json; echo

          if [ "$code" != "200" ]; then
            echo "::error::Expected HTTP 200, got $code"
            exit 1
          fi

          # A 200 with db:false should never happen (the route 500s in that case),
          # but assert it explicitly so a silent regression can't pass as healthy.
          if ! grep -q '"db":true' /tmp/body.json; then
            echo "::error::Ping returned 200 but did not report db:true - DB not reached"
            exit 1
          fi

          echo "Keep-alive OK: database was queried."
